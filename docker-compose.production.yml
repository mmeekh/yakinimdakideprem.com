services:
  api:
    build: .
    container_name: yakinimdakideprem-api
    env_file: env.production
    environment:
      - PORT=${PORT:-8000}
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - web

  static:
    image: caddy:2.8
    container_name: yakinimdakideprem-static
    volumes:
      - ./public:/srv:ro
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":8081", "--browse=false"]
    expose:
      - "8081"
    restart: unless-stopped
    networks:
      - web

  twitter-bot:
    build: .
    container_name: yakinimdakideprem-twitter-bot
    env_file: env.production
    depends_on:
      - api
    command: ["python", "app/twitter_worker.py"]
    volumes:
      - twitter_bot_data:/data
    restart: unless-stopped
    networks:
      - web

  freshness:
    build: .
    container_name: yakinimdakideprem-freshness
    env_file: env.production
    environment:
      - FRESHNESS_API_URL=http://yakinimdakideprem-api:8000/api/earthquakes
      - FRESHNESS_POLL_SECONDS=60
      - FRESHNESS_MIN_MAGNITUDE=3.5
    user: "0:0"      # public/ host'ta root sahipli; root olarak yazsın
    depends_on:
      - api
    command: ["python", "scripts/city_freshness.py"]
    volumes:
      - ./public:/app/public        # writable: HTML, sitemap güncelleyecek
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true

volumes:
  twitter_bot_data:
